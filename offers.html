<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Offers - FoodRush</title>
    <link rel="stylesheet" href="cssfile.css">
</head>

<body>

    <header class="header">

        <div class="container nav">

            <a href="FoodRush.html" class="logo">
                Food<span>Rush</span>
            </a>

            <button class="menu-btn" id="menu-btn">
                ☰
            </button>

            <nav class="navbar" id="navbar">
                <a href="FoodRush.html">Home</a>

                <a href="categories.html">Categories</a>

                <a href="Restaurants.html">Restaurants</a>

                <a href="orders.html">Orders</a>

                <a href="offers.html">Offers</a>

                <a href="About.html">About</a>
            </nav>

            <a href="Login.html" class="login-btn" id="loginBtn">
                Login
            </a>

            <div class="user-info" id="userInfo" style="display: none; color: orange;">

                <span class="user-icon">
                    <img src="images/user.jpg" alt="User Icon" width="30" height="30">
                </span>

                <span class="user-name" id="userName"></span>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>

            <button onclick="toggleTheme()" style="background:none; border:none; font-size:20px; cursor:pointer; margin-left:10px;" title="Toggle theme">
                <img id="theme-icon" src="images/darkmode.jpg" alt="Toggle Theme" width="30" height="30">

            </button>

        </div>

    </header>

    <main>

        <section class="offers-page section" id="offers-page">

            <div class="container">

                <div class="section-heading">

                    <p>TODAY'S DEALS</p>

                    <h2>

                <div class="offers-grid" id="all-offers-grid"></div>

    </main>

    <footer class="footer" id="contact">

        <div class="container footer-content">

            <div class="footer-brand">

                <a href="FoodRush.html" class="logo">
                    Food<span>Rush</span>
                </a>

                <p>
                    Delicious food delivered fast.
                </p>

            </div>

            <div class="footer-links">

                <a href="#home">Home</a>
                <a href="#restaurants">Restaurants</a>
                <a href="#offers">Offers</a>
                <a href="#about">About</a>

            </div>

        </div>

        <div class="copyright">

            <p>
                © 2026 FoodRush. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="script.js"></script>
    <script src="theme.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderAllOffers();
        });
    </script>

</body>

</html>
