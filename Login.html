<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRush - Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <!-- Header -->
    <header class="border-bottom">

        <div class="container py-3">

            <a href="FoodRush.html"
               class="text-decoration-none fs-3 fw-bold text-dark">

                Food<span class="text-danger">Rush</span>

            </a>

        </div>

    </header>


    <!-- Login -->
    <main>

        <div class="container">

            <div class="row justify-content-center mt-5">

                <div class="col-md-5">

                    <div class="card shadow-sm">

                        <div class="card-body p-4">

                            <h2 class="text-center mb-4">
                                Login
                            </h2>


                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                >

                            </div>


                            
                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                >

                            </div>


                           
                            <div class="form-check mb-3">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="remember"
                                >

                                <label
                                    class="form-check-label"
                                    for="remember"
                                >
                                    Remember me
                                </label>

                            </div>


                       
                            <button class="btn btn-danger w-100">
                                Login
                            </button>


                      
                            <p class="text-center mt-3">

                                Don't have an account?

                                <a href="#" class="text-danger">
                                    Register
                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    
    <footer class="text-center mt-5 py-4 border-top">

        <p class="mb-0 text-secondary">
            © 2026 FoodRush. All rights reserved.
        </p>

    </footer>

</body>

</html>
