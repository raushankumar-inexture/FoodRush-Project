<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRush - Login</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- FoodRush CSS -->
    <link rel="stylesheet" href="cssfile.css">

</head>


<body>


    <!-- Header -->
    <header class="header">

        <div class="container nav">


            <!-- Logo -->
            <a href="FoodRush.html" class="logo">

                Food<span>Rush</span>

            </a>


            <!-- Hamburger Button -->
            <button
                class="menu-btn"
                id="menu-btn"
                type="button"
            >
                ☰
            </button>


            <!-- Navigation -->
            <nav class="navbar" id="navbar">

                <a href="FoodRush.html">
                    Home
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a href="Restaurants.html">
                    Restaurants
                </a>

                <a href="offers.html">
                    Offers
                </a>

                <a href="FoodRush.html#about">
                    About
                </a>

            </nav>


            <!-- Login Button -->
            <a href="Login.html" class="login-btn">
                Login
            </a>


        </div>

    </header>



    <!-- Login Section -->
    <main>

        <div class="container">


            <div class="row justify-content-center mt-5 mb-5">

                <div class="col-md-5">


                    <div class="card shadow-sm">


                        <div class="card-body p-4">


                            <h2 class="text-center mb-4">
                                Login
                            </h2>


                            <!-- Login Form -->
                            <form id="loginForm">


                                <!-- Email -->
                                <div class="mb-3">

                                    <label
                                        for="email"
                                        class="form-label"
                                    >
                                        Email
                                    </label>


                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                    >


                                    <!-- Email Error -->
                                    <div
                                        id="emailError"
                                        class="text-danger mt-1"
                                    ></div>

                                </div>



                                <!-- Password -->
                                <div class="mb-3">

                                    <label
                                        for="password"
                                        class="form-label"
                                    >
                                        Password
                                    </label>


                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                    >


                                    <!-- Password Error -->
                                    <div
                                        id="passwordError"
                                        class="text-danger mt-1"
                                    ></div>

                                </div>



                                <!-- Remember Me -->
                                <div class="form-check mb-3">

                                    <input
                                        type="checkbox"
                                        id="remember"
                                        class="form-check-input"
                                    >


                                    <label
                                        class="form-check-label"
                                        for="remember"
                                    >
                                        Remember me
                                    </label>

                                </div>



                                <!-- General Error -->
                                <div
                                    id="loginError"
                                    class="text-danger text-center mb-3"
                                ></div>



                                <!-- Success Message -->
                                <div
                                    id="loginSuccess"
                                    class="text-success text-center mb-3"
                                ></div>



                                <!-- Login Button -->
                                <button
                                    type="submit"
                                    class="btn btn-danger w-100"
                                >
                                    Login
                                </button>


                            </form>



                            <!-- Register -->
                            <p class="text-center mt-3">

                                Don't have an account?

                                <a
                                    href="#"
                                    class="text-danger"
                                >
                                    Register
                                </a>

                            </p>


                        </div>

                    </div>


                </div>

            </div>


        </div>

    </main>



    <!-- Footer -->
    <footer class="footer">


        <div class="container footer-content">


            <!-- Footer Brand -->
            <div class="footer-brand">

                <a
                    href="FoodRush.html"
                    class="logo"
                >
                    Food<span>Rush</span>
                </a>


                <p>
                    Delicious food delivered fast.
                </p>

            </div>



            <!-- Footer Links -->
            <div class="footer-links">

                <a href="FoodRush.html">
                    Home
                </a>

                <a href="categories.html">
                    Categories
                </a>

                <a href="Restaurants.html">
                    Restaurants
                </a>

                <a href="offers.html">
                    Offers
                </a>

                <a href="FoodRush.html#about">
                    About
                </a>

            </div>


        </div>



        <!-- Copyright -->
        <div class="copyright">

            <p>
                © 2026 FoodRush. All rights reserved.
            </p>

        </div>


    </footer>



    <!-- JavaScript -->
    <script>

        // Get form and input elements

        const loginForm = document.getElementById("loginForm");

        const email = document.getElementById("email");

        const password = document.getElementById("password");

        const emailError = document.getElementById("emailError");

        const passwordError = document.getElementById("passwordError");

        const loginError = document.getElementById("loginError");

        const loginSuccess = document.getElementById("loginSuccess");



        // Login validation

        loginForm.addEventListener("submit", function(event) {

            // Stop form from refreshing the page

            event.preventDefault();


            // Clear old messages

            emailError.textContent = "";

            passwordError.textContent = "";

            loginError.textContent = "";

            loginSuccess.textContent = "";


            let isValid = true;



            // Email validation

            if (email.value.trim() === "") {

                emailError.textContent =
                    "Please enter your email address.";

                isValid = false;

            }

            else if (!email.value.includes("@")) {

                emailError.textContent =
                    "Please enter a valid email address.";

                isValid = false;

            }



            // Password validation

            if (password.value.trim() === "") {

                passwordError.textContent =
                    "Please enter your password.";

                isValid = false;

            }

            else if (password.value.length < 6) {

                passwordError.textContent =
                    "Password must be at least 6 characters.";

                isValid = false;

            }



            // Stop if validation fails

            if (!isValid) {

                loginError.textContent =
                    "Please correct the errors above.";

                return;

            }



            // Login success

            loginSuccess.textContent =
                "Login successful Welcome to FoodRush.";

        });



        // Hamburger menu

        const menuButton = document.getElementById("menu-btn");

        const navbar = document.getElementById("navbar");


        menuButton.addEventListener("click", function() {

            navbar.classList.toggle("active");

        });

    </script>


</body>

</html>
