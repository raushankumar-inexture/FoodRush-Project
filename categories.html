<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRush - Categories</title>

    <link rel="stylesheet" href="cssfile.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container nav">

            <a href="FoodRush.html" class="logo">
                Food<span>Rush</span>
            </a>

            <nav class="navbar">

                <a href="FoodRush.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="FoodRush.html#restaurants">Restaurants</a>
                <a href="FoodRush.html#offers">Offers</a>
                <a href="FoodRush.html#about">About</a>

            </nav>

            <a href="cart.html" class="login-btn">
                Cart <span id="cart-count" style="margin-left: 5px;">0</span>
            </a>

            <button onclick="toggleTheme()" style="background:none; border:none; font-size:20px; cursor:pointer; margin-left:10px;" title="Toggle theme">🌓</button>

        </div>

    </header>

    <!-- Categories Page -->
    <main>

        <section class="categories section">

            <div class="container">

                <!-- Page Heading -->
                <div class="section-heading">

                    <p>EXPLORE</p>

                    <h1>Categories</h1>

                </div>


                <!-- Sort Buttons -->
                <div style="margin-bottom:20px; text-align:center;">
                    <button onclick="sortByPrice('low')" style="padding:10px 20px; margin:5px; border:1px solid #ff5a36; background-color:#ffffff; color:#ff5a36; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold;">Low to High</button>
                    <button onclick="sortByPrice('high')" style="padding:10px 20px; margin:5px; border:1px solid #ff5a36; background-color:#ffffff; color:#ff5a36; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold;">High to Low</button>
                </div>

                <!-- Filters -->
                <div style="margin-bottom:20px; text-align:center;">
                    <select id="filter-cuisine" onchange="applyFilters()" style="padding:8px 12px; border:1px solid #ff5a36; border-radius:6px; font-size:13px; color:#333;">
                        <option value="all">All Cuisines</option>
                        <option value="Italian">Italian</option>
                        <option value="American">American</option>
                        <option value="Asian">Asian</option>
                        <option value="Indian">Indian</option>
                        <option value="Mexican">Mexican</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                    <select id="filter-rating" onchange="applyFilters()" style="padding:8px 12px; border:1px solid #ff5a36; border-radius:6px; font-size:13px; color:#333;">
                        <option value="0">All Ratings</option>
                        <option value="4.7">4.7 & above</option>
                        <option value="4.5">4.5 & above</option>
                    </select>
                    <select id="filter-price" onchange="applyFilters()" style="padding:8px 12px; border:1px solid #ff5a36; border-radius:6px; font-size:13px; color:#333;">
                        <option value="all">All Prices</option>
                        <option value="0-200">Under ₹200</option>
                        <option value="200-250">₹200 - ₹250</option>
                        <option value="250+">Above ₹250</option>
                    </select>
                    <button onclick="resetFilters()" style="padding:8px 16px; margin:5px; border:1px solid #ff5a36; background-color:#ffffff; color:#ff5a36; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;">Reset</button>
                </div>

                <!-- Food Items -->
                <div class="category-grid">

                    <!-- Pizza -->
                    <div class="category-card" data-category="pizza" data-price="250" data-cuisine="Italian" data-rating="4.8">

                        <div class="category-icon">
                            <img src="images/pizza.jpg" alt="Pizza">
                        </div>

                        <h3>Pizza</h3>

                        <p>₹250</p>

                        <button onclick="addToCart('Pizza', 250)">
                            Add to Cart
                        </button>

                    </div>


                    <!-- Burgers -->
                    <div class="category-card" data-category="burger" data-price="150" data-cuisine="American" data-rating="4.6">

                        <div class="category-icon">
                            <img src="images/burger.jpg" alt="Burger">
                        </div>

                        <h3>Burger</h3>

                        <p>₹150</p>

                        <button onclick="addToCart('Burger', 150)">
                            Add to Cart
                        </button>

                    </div>


                    <!-- Noodles -->
                    <div class="category-card" data-category="noodles" data-price="180" data-cuisine="Asian" data-rating="4.7">

                        <div class="category-icon">
                            <img src="images/noodles.jpg" alt="Noodles">
                        </div>

                        <h3>Noodles</h3>

                        <p>₹180</p>

                        <button onclick="addToCart('Noodles', 180)">
                            Add to Cart
                        </button>

                    </div>


                    <!-- Biryani -->
                    <div class="category-card" data-category="biryani" data-price="220" data-cuisine="Indian" data-rating="4.5">

                        <div class="category-icon">
                            <img src="images/biryani.jpg" alt="Biryani">
                        </div>

                        <h3>Biryani</h3>

                        <p>₹220</p>

                        <button onclick="addToCart('Biryani', 220)">
                            Add to Cart
                        </button>

                    </div>


                    <!-- Mexican -->
                    <div class="category-card" data-category="mexican" data-price="200" data-cuisine="Mexican" data-rating="4.4">

                        <div class="category-icon">
                            <img src="images/ mexican.jpg" alt="Mexican Food">
                        </div>

                        <h3>Mexican</h3>

                        <p>₹200</p>

                        <button onclick="addToCart('Mexican Food', 200)">
                            Add to Cart
                        </button>

                    </div>


                    <!-- Desserts -->
                    <div class="category-card" data-category="dessert" data-price="120" data-cuisine="Desserts" data-rating="4.9">

                        <div class="category-icon">
                            <img src="images/dessert.jpg" alt="Desserts">
                        </div>

                        <h3>Dessert</h3>

                        <p>₹120</p>

                        <button onclick="addToCart('Dessert', 120)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <div>

                <a href="FoodRush.html" class="logo">
                    Food<span>Rush</span>
                </a>

                <p>
                    Delicious food delivered fast.
                </p>

            </div>


            <div class="footer-links">

                <a href="FoodRush.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="Restaurants.html">Restaurants</a>
                <a href="Offers.html">Offers</a>
                <a href="About.html">About</a>

            </div>

        </div>


        <div class="copyright">

            <p>
                © 2026 FoodRush. All rights reserved.
            </p>

        </div>

    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const restaurant = params.get('restaurant');

        if (restaurant) {
            const cards = document.querySelectorAll('.category-card');
            cards.forEach(card => {
                if (card.dataset.category === restaurant) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function sortByPrice(order) {
            const grid = document.querySelector('.category-grid');
            const cards = Array.from(grid.querySelectorAll('.category-card'));
            cards.sort((a, b) => {
                if (order === 'low') {
                    return parseInt(a.dataset.price) - parseInt(b.dataset.price);
                } else {
                    return parseInt(b.dataset.price) - parseInt(a.dataset.price);
                }
            });
            cards.forEach(card => grid.appendChild(card));
        }

        function applyFilters() {
            let cuisine = document.getElementById("filter-cuisine").value;
            let rating = parseFloat(document.getElementById("filter-rating").value);
            let priceRange = document.getElementById("filter-price").value;

            const cards = document.querySelectorAll('.category-card');
            cards.forEach(card => {
                let cardCuisine = card.dataset.cuisine;
                let cardRating = parseFloat(card.dataset.rating);
                let cardPrice = parseInt(card.dataset.price);

                let show = true;

                if (cuisine !== "all" && cardCuisine !== cuisine) {
                    show = false;
                }

                if (rating > 0 && cardRating < rating) {
                    show = false;
                }

                if (priceRange !== "all") {
                    if (priceRange === "0-200" && cardPrice >= 200) show = false;
                    if (priceRange === "200-250" && (cardPrice < 200 || cardPrice > 250)) show = false;
                    if (priceRange === "250+" && cardPrice <= 250) show = false;
                }

                card.style.display = show ? '' : 'none';
            });
        }

        function resetFilters() {
            document.getElementById("filter-cuisine").value = "all";
            document.getElementById("filter-rating").value = "0";
            document.getElementById("filter-price").value = "all";
            applyFilters();
        }
    </script>

    <script src="theme.js"></script>
    <script src="cart.js"></script>

</body>

</html>
