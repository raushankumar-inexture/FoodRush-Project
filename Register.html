<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodRush - Register</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- FoodRush CSS -->
    <link rel="stylesheet" href="cssfile.css">

</head>


<body>

    <!-- Header -->
    <header class="header">
        <div class="container nav">

            <!-- Logo -->
            <a href="FoodRush.html" class="logo">
                Food<span>Rush</span>
            </a>

            <!-- Hamburger Button -->
            <button class="menu-btn" id="menu-btn" type="button">
                ☰
            </button>

            <!-- Navigation -->
            <nav class="navbar" id="navbar">
                <a href="FoodRush.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="Restaurants.html">Restaurants</a>
                <a href="offers.html">Offers</a>
                <a href="FoodRush.html#about">About</a>
            </nav>

            <!-- Login Button -->
            <a href="Login.html" class="login-btn">
                Login
            </a>

        </div>
    </header>

    <!-- Registration Section -->
    <main>
        <div class="container">
            <div class="row justify-content-center mt-5 mb-5">
                <div class="col-md-5">

                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <h2 class="text-center mb-4">Register</h2>

                            <!-- Registration Form -->
                            <form id="registerForm">

                                <!-- Name -->
                                <div class="mb-3">
                                    <label for="name" class="form-label">
                                        Name
                                    </label>
                                    <input type="text" id="name" class="form-control"
                                        placeholder="Enter your name">
                                    <div id="nameError" class="text-danger mt-1"></div>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email
                                    </label>
                                    <input type="email" id="email" class="form-control"
                                        placeholder="Enter your email">
                                    <div id="emailError" class="text-danger mt-1"></div>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Password
                                    </label>
                                    <input type="password" id="password" class="form-control"
                                        placeholder="Enter your password">
                                    <div id="passwordError" class="text-danger mt-1"></div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">
                                        Confirm Password
                                    </label>
                                    <input type="password" id="confirmPassword" class="form-control"
                                        placeholder="Confirm your password">
                                    <div id="confirmPasswordError" class="text-danger mt-1"></div>
                                </div>

                                <!-- General Error -->
                                <div id="registerError" class="text-danger text-center mb-3"></div>

                                <!-- Success Message -->
                                <div id="registerSuccess" class="text-success text-center mb-3"></div>

                                <!-- Register Button -->
                                <button type="submit" class="btn btn-danger w-100">
                                    Register
                                </button>

                            </form>

                            <!-- Login -->
                            <p class="text-center mt-3">
                                Already have an account?
                                <a href="Login.html" class="text-danger">
                                    Login
                                </a>
                            </p>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <!-- Footer Brand -->
            <div class="footer-brand">
                <a href="FoodRush.html" class="logo">
                    Food<span>Rush</span>
                </a>
                <p>Delicious food delivered fast.</p>
            </div>

            <!-- Footer Links -->
            <div class="footer-links">
                <a href="FoodRush.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="Restaurants.html">Restaurants</a>
                <a href="offers.html">Offers</a>
                <a href="FoodRush.html#about">About</a>
            </div>
        </div>

        <!-- Copyright -->
        <div class="copyright">
            <p>© 2026 FoodRush. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Get form and input elements
        const registerForm = document.getElementById("registerForm");
        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const confirmPasswordError = document.getElementById("confirmPasswordError");
        const registerError = document.getElementById("registerError");
        const registerSuccess = document.getElementById("registerSuccess");

        // Registration validation
        registerForm.addEventListener("submit", function(event) {
            // Stop form from refreshing the page
            event.preventDefault();

            // Clear old messages
            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            confirmPasswordError.textContent = "";
            registerError.textContent = "";
            registerSuccess.textContent = "";

            let isValid = true;

            // Name validation
            if (name.value.trim() === "") {
                nameError.textContent = "Please enter your name.";
                isValid = false;
            }

            // Email validation
            if (email.value.trim() === "") {
                emailError.textContent = "Please enter your email address.";
                isValid = false;
            } else if (!email.value.includes("@")) {
                emailError.textContent = "Please enter a valid email address.";
                isValid = false;
            } else {
                // Check if email already exists
                const existingUsers = JSON.parse(localStorage.getItem("foodrushUsers")) || [];
                if (existingUsers.some(user => user.email === email.value)) {
                    emailError.textContent = "This email is already registered.";
                    isValid = false;
                }
            }

            // Password validation
            if (password.value.trim() === "") {
                passwordError.textContent = "Please enter your password.";
                isValid = false;
            } else if (password.value.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters.";
                isValid = false;
            }

            // Confirm password validation
            if (confirmPassword.value.trim() === "") {
                confirmPasswordError.textContent = "Please confirm your password.";
                isValid = false;
            } else if (confirmPassword.value !== password.value) {
                confirmPasswordError.textContent = "Passwords do not match.";
                isValid = false;
            }

            // Stop if validation fails
            if (!isValid) {
                registerError.textContent = "Please correct the errors above.";
                return;
            }

            // Store user in localStorage
            const newUser = {
                name: name.value,
                email: email.value,
                password: password.value
            };

            const existingUsers = JSON.parse(localStorage.getItem("foodrushUsers")) || [];
            existingUsers.push(newUser);
            localStorage.setItem("foodrushUsers", JSON.stringify(existingUsers));

            // Show success message
            registerSuccess.textContent = "Registration successful! Redirecting to login...";

            // Redirect to Login.html after 1.5 seconds
            setTimeout(() => {
                window.location.href = "Login.html";
            }, 1500);
        });

        // Hamburger menu
        const menuButton = document.getElementById("menu-btn");
        const navbar = document.getElementById("navbar");

        menuButton.addEventListener("click", function() {
            navbar.classList.toggle("active");
        });
    </script>

</body>

</html>
