<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRush - Shopping Cart</title>

    <link rel="stylesheet" href="cssfile.css">
</head>


<body style="
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
">


    <!-- Header -->
    <header class="header" style="width: 100%;">

        <div class="container nav">

            <a href="FoodRush.html" class="logo">
                Food<span>Rush</span>
            </a>

            <nav class="navbar">

                <a href="FoodRush.html">Home</a>

                <a href="categories.html">Categories</a>

                <a href="FoodRush.html#restaurants">Restaurants</a>

                <a href="FoodRush.html#offers">Offers</a>

                <a href="FoodRush.html#about">About</a>

            </nav>

            <a href="cart.html" class="login-btn">
                Cart <span id="cart-count">0</span>
            </a>

        </div>

    </header>



    <!-- Cart Page -->
    <main style="
        flex: 1;
        width: 100%;
        box-sizing: border-box;
    ">


        <section class="cart-page" style="
            width: 100%;
            padding: 50px 20px;
            box-sizing: border-box;
        ">


            <div style="
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                box-sizing: border-box;
            ">


                <!-- Heading -->
                <div style="margin-bottom: 40px;">

                    <p style="
                        color: #ff5a36;
                        font-size: 14px;
                        font-weight: bold;
                        margin-bottom: 10px;
                        letter-spacing: 1px;
                    ">
                        YOUR ORDER
                    </p>

                    <h1 style="
                        font-size: 42px;
                        line-height: 1.2;
                        font-weight: bold;
                        margin: 0;
                    ">
                        Shopping Cart
                    </h1>

                </div>



                <!-- Cart Box -->
                <div style="
                    width: 100%;
                    box-sizing: border-box;
                    background-color: #ffffff;
                    padding: 40px;
                    border-radius: 12px;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                ">


                    <!-- Cart Items -->
                    <div id="cart-items" style="
                        min-height: 250px;
                        width: 100%;
                    ">

                        <p style="
                            text-align: center;
                            color: #999;
                            padding: 50px 0;
                            font-size: 18px;
                        ">
                            Your cart is empty.
                        </p>

                    </div>



                    <!-- Total -->
                    <div style="
                        margin-top: 40px;
                        padding-top: 30px;
                        border-top: 3px solid #f0f0f0;
                    ">


                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 30px;
                        ">

                            <h3 style="
                                font-size: 20px;
                                color: #333;
                                margin: 0;
                            ">
                                Total Amount:
                            </h3>


                            <h3 style="
                                font-size: 32px;
                                margin: 0;
                                color: #ff5a36;
                                font-weight: bold;
                            ">
                                ₹<span id="cart-total">0</span>
                            </h3>

                        </div>



                        <!-- Place Order -->
                        <button class="order-btn" onclick="placeOrder()" style="
                                display: block;
                                width: 100%;
                                max-width: 450px;
                                margin: 0 auto;
                                background-color: #ff5a36;
                                color: white;
                                border: none;
                                padding: 16px 30px;
                                border-radius: 8px;
                                cursor: pointer;
                                font-size: 18px;
                                font-weight: bold;
                            ">
                            Place Order
                        </button>
                        <button onclick="clearCart()" style="
        display: block;
        width: 100%;
        max-width: 450px;
        margin: 15px auto 0;
        background-color: #ffffff;
        color: #ff5a36;
        border: 1px solid #ff5a36;
        padding: 14px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    ">
                            Clear Cart
                        </button>


                        <!-- Success Message -->
                        <p id="success-message" style="
                            text-align: center;
                            color: #28a745;
                            font-weight: bold;
                            margin-top: 20px;
                            font-size: 18px;
                        "></p>


                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- Footer -->
    <footer class="footer" style="
        width: 100%;
        background-color: #222222;
        color: #ffffff;
        padding: 30px 0 20px 0;
        margin-top: auto;
    ">


        <div style="
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
        ">


            <!-- Footer Brand -->
            <div style="
                flex: 1;
                min-width: 250px;
            ">

                <a href="FoodRush.html" class="logo" style="
                        font-size: 26px;
                        font-weight: bold;
                        color: #ffffff;
                        margin-bottom: 15px;
                        display: inline-block;
                    ">
                    Food<span style="color: #ff5a36;">Rush</span>
                </a>

                <p style="
                    color: #cccccc;
                    margin: 0;
                    line-height: 1.6;
                ">
                    Delicious food delivered fast.
                </p>

            </div>



            <!-- Footer Links -->
            <div style="
                flex: 1;
                min-width: 250px;
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
            ">

                <a href="FoodRush.html">Home</a>

                <a href="categories.html">Categories</a>

                <a href="FoodRush.html#restaurants">Restaurants</a>

                <a href="FoodRush.html#offers">Offers</a>

                <a href="FoodRush.html#about">About</a>

            </div>


        </div>



        <!-- Copyright -->
        <div style="
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #333333;
            margin-top: 20px;
        ">

            <p style="
                color: #888888;
                margin: 0;
                font-size: 14px;
            ">
                © 2026 FoodRush. All rights reserved.
            </p>

        </div>

    </footer>




    <script src="cart.js"></script>

</body>

</html>
